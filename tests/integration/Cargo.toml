[package]
name = "torvyn-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "Workspace-level integration tests for Torvyn"
build = "build.rs"

[features]
# Gate the real-Wasm end-to-end test (`tests/test_real_wasm_e2e.rs`).
# CI's dedicated `wasm-e2e` job enables this; plain `cargo test --workspace`
# does not, keeping the standard test matrix toolchain-free.
wasm-e2e = []

# Gate the polyglot end-to-end test (`tests/test_polyglot_e2e.rs`),
# which uses a TinyGo-built source component alongside the Rust
# processor + sink. Implies `wasm-e2e` because the test reuses the
# real-Wasm scaffolding (`RecordingInvoker`, helpers in
# `src/lib.rs::real_wasm`). CI's `wasm-polyglot-e2e` job enables this.
wasm-polyglot = ["wasm-e2e"]

[dependencies]
# Internal crates
torvyn-types = { path = "../../crates/torvyn-types" }
torvyn-engine = { path = "../../crates/torvyn-engine", default-features = false, features = ["mock", "wasmtime-backend"] }
torvyn-reactor = { path = "../../crates/torvyn-reactor" }
torvyn-resources = { path = "../../crates/torvyn-resources" }
torvyn-security = { path = "../../crates/torvyn-security" }
torvyn-pipeline = { path = "../../crates/torvyn-pipeline" }
torvyn-config = { path = "../../crates/torvyn-config" }
torvyn-host = { path = "../../crates/torvyn-host" }

# External
tokio = { version = "1.41.0", features = ["full"] }
async-trait = "0.1"

[lints]
workspace = true

[[test]]
name = "test_real_wasm_e2e"
required-features = ["wasm-e2e"]

[[test]]
name = "test_polyglot_e2e"
required-features = ["wasm-polyglot"]
